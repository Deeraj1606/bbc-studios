name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: test -f package.json
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        if: test -f package.json
        run: npm ci
      - name: Build
        if: test -f package.json
        run: npm run build
